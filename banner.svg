<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0b0f19" />
      <stop offset="50%" stopColor="#080c16" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>

    <!-- Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#6366f1" />
      <stop offset="50%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>

    <!-- Point Glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Line Animations -->
    <style>
      @keyframes lineRotate {
        0%, 15% {
          /* Initial bad fit */
          transform: rotate(-18deg) translate(0px, 40px);
        }
        40%, 65% {
          /* Intermediate training */
          transform: rotate(-6deg) translate(0px, 15px);
        }
        80%, 95% {
          /* Converged optimal fit */
          transform: rotate(0deg) translate(0px, 0px);
        }
        100% {
          transform: rotate(-18deg) translate(0px, 40px);
        }
      }

      @keyframes pulseGlow {
        0%, 100% { r: 6; opacity: 0.8; }
        50% { r: 8.5; opacity: 1; filter: drop-shadow(0 0 8px #f43f5e); }
      }

      @keyframes residualShrink {
        0%, 15% { opacity: 0.9; stroke: #f43f5e; stroke-dasharray: 4 3; transform: scaleY(1.4); }
        40%, 65% { opacity: 0.7; stroke: #f59e0b; stroke-dasharray: 3 3; transform: scaleY(0.8); }
        80%, 95% { opacity: 0.4; stroke: #10b981; stroke-dasharray: 2 2; transform: scaleY(0.2); }
        100% { opacity: 0.9; stroke: #f43f5e; stroke-dasharray: 4 3; transform: scaleY(1.4); }
      }

      @keyframes metricChange {
        0%, 15% { opacity: 0.9; }
        50% { opacity: 0.4; }
        80%, 100% { opacity: 0.9; }
      }

      .animated-line {
        transform-origin: 320px 170px;
        animation: lineRotate 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .pulse-dot {
        animation: pulseGlow 3s ease-in-out infinite;
      }

      .residual-line {
        transform-origin: 320px 170px;
        animation: residualShrink 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .metric-badge {
        animation: metricChange 8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Banner Background -->
  <rect width="850" height="320" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Background Decorative Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" opacity="0.6">
    <line x1="80" y1="50" x2="80" y2="270" />
    <line x1="160" y1="50" x2="160" y2="270" />
    <line x1="240" y1="50" x2="240" y2="270" />
    <line x1="320" y1="50" x2="320" y2="270" />
    <line x1="400" y1="50" x2="400" y2="270" />
    <line x1="480" y1="50" x2="480" y2="270" />

    <line x1="80" y1="70" x2="520" y2="70" />
    <line x1="80" y1="120" x2="520" y2="120" />
    <line x1="80" y1="170" x2="520" y2="170" />
    <line x1="80" y1="220" x2="520" y2="220" />
    <line x1="80" y1="270" x2="520" y2="270" />
  </g>

  <!-- Scatter Graph Axes -->
  <line x1="80" y1="270" x2="530" y2="270" stroke="#475569" stroke-width="2" />
  <line x1="80" y1="50" x2="80" y2="270" stroke="#475569" stroke-width="2" />

  <!-- Animated Residual Error Lines (wx + b - y) -->
  <g class="residual-line">
    <line x1="140" y1="230" x2="140" y2="245" stroke="#f43f5e" stroke-width="2" />
    <line x1="200" y1="190" x2="200" y2="205" stroke="#f43f5e" stroke-width="2" />
    <line x1="250" y1="160" x2="250" y2="175" stroke="#f43f5e" stroke-width="2" />
    <line x1="310" y1="145" x2="310" y2="140" stroke="#f43f5e" stroke-width="2" />
    <line x1="370" y1="125" x2="370" y2="110" stroke="#f43f5e" stroke-width="2" />
    <line x1="430" y1="85" x2="430" y2="90" stroke="#f43f5e" stroke-width="2" />
    <line x1="490" y1="65" x2="490" y2="60" stroke="#f43f5e" stroke-width="2" />
  </g>

  <!-- Animated Rotating Regression Line -->
  <g class="animated-line">
    <line x1="70" y1="265" x2="540" y2="45" stroke="url(#lineGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
    <!-- Secondary motion trail -->
    <line x1="70" y1="265" x2="540" y2="45" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Scatter Data Points (Attendance vs Exam Score) -->
  <g filter="url(#glow)">
    <circle cx="140" cy="230" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="2" class="pulse-dot" />
    <circle cx="200" cy="190" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="2" class="pulse-dot" />
    <circle cx="250" cy="160" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="2" class="pulse-dot" />
    <circle cx="310" cy="145" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="2" class="pulse-dot" />
    <circle cx="370" cy="125" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="2" class="pulse-dot" />
    <circle cx="430" cy="85" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="2" class="pulse-dot" />
    <circle cx="490" cy="65" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="2" class="pulse-dot" />
  </g>

  <!-- Information & Hero Text Overlay (Right Side) -->
  <g transform="translate(560, 45)">
    <!-- Header Category Badge -->
    <rect width="180" height="24" rx="12" fill="#312e81" opacity="0.6" stroke="#4f46e5" stroke-width="1" />
    <text x="12" y="16" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">
      ⚡ INTERACTIVE SIMULATOR
    </text>

    <!-- Main Title -->
    <text x="0" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" letter-spacing="-0.5">
      Linear Regression
    </text>
    <text x="0" y="82" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">
      Gradient Descent Lab
    </text>

    <!-- Subtitle / Formula -->
    <text x="0" y="112" fill="#94a3b8" font-family="monospace" font-size="13">
      f(x) = w · x + b
    </text>
    <text x="0" y="130" fill="#64748b" font-family="monospace" font-size="11">
      J(w, b) = 1/(2m) Σ(wx+b - y)²
    </text>

    <!-- Animated Metric Cards -->
    <g transform="translate(0, 150)" class="metric-badge">
      <!-- Metric 1: Cost Reduction -->
      <g transform="translate(0, 0)">
        <rect width="125" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="10" y="18" fill="#64748b" font-family="sans-serif" font-size="10">Loss J(w,b)</text>
        <text x="10" y="38" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold">33.9 → 0.04</text>
      </g>

      <!-- Metric 2: Slope Adaptation -->
      <g transform="translate(135, 0)">
        <rect width="125" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="10" y="18" fill="#64748b" font-family="sans-serif" font-size="10">Slope (w)</text>
        <text x="10" y="38" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">0.10 → 1.37</text>
      </g>
    </g>

    <!-- Convergence Status Pill -->
    <g transform="translate(0, 215)">
      <rect width="260" height="26" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#10b981" />
      <text x="26" y="17" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
        Gradient Descent Optimization Active
      </text>
    </g>
  </g>

  <!-- Bottom Coordinates Indicator -->
  <text x="90" y="295" fill="#64748b" font-family="monospace" font-size="10">Feature X (Attendance / Advertising)</text>
  <text x="440" y="295" fill="#64748b" font-family="monospace" font-size="10">Target Y (Score / Sales)</text>
</svg>
